services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./apps/api/app:/app/app

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./apps/web/src:/repo/apps/web/src
    depends_on:
      - api

  # Phase 4's app/rendering/slide_renderer.py shells out to `soffice` directly
  # as a subprocess inside the api container (see apps/api/Dockerfile), rather
  # than talking to a separate LibreOffice service over the network -- this
  # standalone container isn't on that render path and can be removed if you
  # don't need it for anything else (e.g. manual inspection via its noVNC UI).
  # Commented out for faster startup:
  # libreoffice:
  #   image: linuxserver/libreoffice:latest
  #   environment:
  #     - PUID=1000
  #     - PGID=1000
  #   volumes:
  #     - ./tmp/slides:/data
